name: Bug report
description: Report something broken in buildlog.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is broken?
      description: Describe the behavior you saw and what you expected instead.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or URL
      placeholder: "https://log.ozzo.blog/feedback"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Keep this short and concrete.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser/device
      placeholder: "Safari on iPhone, Chrome on desktop, etc."
    validations:
      required: false
