name: Feedback
description: Share a concrete suggestion or note about buildlog.
title: "[Feedback]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback is this?
      options:
        - Something unclear
        - Something useful
        - Something missing
        - Other
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What feedback do you have?
      description: Concrete examples are the most useful.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context or link
      placeholder: "Entry URL, screenshot link, related project, etc."
    validations:
      required: false
