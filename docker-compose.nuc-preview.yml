services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: buildlog-nuc-web
    working_dir: /app
    environment:
      RAILS_ENV: development
      PORT: "3000"
    command: >
      bash -lc "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        npm ci &&
        bundle exec rails db:prepare &&
        bundle exec foreman start -f Procfile.dev.nuc
      "
    ports:
      - "3007:3000"
    volumes:
      - .:/app
      # Own SQLite database, separate from both the host's local dev DB and
      # production — this mount shadows ./storage from the bind mount above
      # with a container-only named volume.
      - buildlog_nuc_storage:/app/storage
    networks:
      default:
      npm:
        aliases:
          - buildlog-nuc
    restart: unless-stopped

volumes:
  buildlog_nuc_storage:

networks:
  npm:
    external: true
    name: data-hub_default
