services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: buildlog-nuc-web
    working_dir: /app
    environment:
      RAILS_ENV: development
      PORT: "3000"
      BINDING: "0.0.0.0"
    command: >
      bash -lc "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        npm ci &&
        bundle exec rails db:prepare &&
        bundle exec rails server -b 0.0.0.0 -p 3000
      "
    ports:
      - "3007:3000"
    volumes:
      - .:/app
    networks:
      default:
      npm:
        aliases:
          - buildlog-nuc
    restart: unless-stopped

networks:
  npm:
    external: true
    name: data-hub_default
